name: Update WC2026 Results

on:
  # schedule:
  #   - cron: '0 6 * * *'   # daily at 06:00 UTC — covers overnight match windows globally — PAUSED: WC2026 tournament ended
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch live scores
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-wc2026-results.js

      - name: Commit results if changed
        run: |
          git config user.name  "2sides-bot"
          git config user.email "bot@2sides-data"
          git add wc2026/
          git diff --staged --quiet || git commit -m "chore: update wc2026 scores $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
