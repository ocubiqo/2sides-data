name: Validate data

# Schema-gates every change to topics/ or tallies/. A malformed topic reaches
# every user at once, so this blocks the merge rather than warning after it.

on:
  pull_request:
    paths:
      - 'topics/**'
      - 'tallies/**'
      - 'fixtures/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/pipeline/**'
  push:
    branches: [main]
    paths:
      - 'topics/**'
      - 'tallies/**'
      - 'fixtures/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/pipeline/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=optional || npm install

      # Guards the URL-provenance rule: a source is trusted only if the search
      # tool returned it. If this regresses, the app ships "Verified" badges on
      # links that 404 — which is exactly what the retired seed data did.
      - name: Unit tests
        run: npm test

      # Fixtures next, and this is the load-bearing step: it proves the rules
      # actually reject bad data. Without it, an empty topics/IN/active makes
      # the real-data run below pass having checked nothing.
      - name: Validate fixtures (asserts invalid-* are rejected)
        run: node scripts/pipeline/validate-data.js --fixtures

      - name: Validate real topics and tallies
        run: node scripts/pipeline/validate-data.js

      # Proves the feed still assembles from the changed data before it ships.
      # --allow-empty because an in-progress migration may legitimately have no
      # published topics; the daily batch does NOT pass it.
      - name: Build feed
        run: node scripts/pipeline/build-feed.js --allow-empty
