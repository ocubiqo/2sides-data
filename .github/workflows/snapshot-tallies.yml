name: Snapshot tallies

# Appends one point to every active topic's history, then rebuilds the feed.
# Without this job there is no trend series, so the sentiment chart and the
# saved-row sparkline have nothing to draw.
#
# Every 6h = 4 points/day = 28 over the chart's week window, which is enough
# resolution for a 7-point downsample without bloating the committed files.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: Country code
        default: IN
        required: false

concurrency:
  group: tallies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --omit=optional || npm install

      # Nothing published yet means there is nothing to snapshot, and rebuilding
      # would hit build-feed's empty-feed guard. Skip rather than fail, so this
      # cron stays quiet until the first batch is approved.
      - name: Check for published topics
        id: check
        run: |
          COUNT=$(ls -1 topics/"${{ inputs.country || 'IN' }}"/active/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT published topic(s)"

      - name: Snapshot live tallies
        if: steps.check.outputs.count != '0'
        env:
          # Both unset today (no-op snapshot — see the script's own header
          # comment) until the Cloudflare domain is connected and secrets are
          # set here. See the multi-channel reach plan, Phase D4.
          VOTE_API_BASE: ${{ secrets.VOTE_API_BASE }}
          VOTE_API_ADMIN_TOKEN: ${{ secrets.VOTE_API_ADMIN_TOKEN }}
        run: node scripts/pipeline/snapshot-tallies.js --country "${{ inputs.country || 'IN' }}"

      - name: Rebuild feed
        if: steps.check.outputs.count != '0'
        run: node scripts/pipeline/build-feed.js --country "${{ inputs.country || 'IN' }}"

      - name: Validate before committing
        if: steps.check.outputs.count != '0'
        run: node scripts/pipeline/validate-data.js

      - name: Commit
        id: commit
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "2sides-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tallies feeds
          if git diff --staged --quiet; then
            echo "no change"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: tally snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Rebuilds and redeploys the site — the website only picks up new vote
      # data when this runs. See the multi-channel reach plan, Phase D4/trap
      # T4. This is NOT a Cloudflare Pages "deploy hook" (that only works for
      # a git-connected Pages project, which web/ isn't — it's deployed via
      # `wrangler pages deploy` from a built dist/, so there is nothing on
      # Cloudflare's side for a hook to rebuild from). Instead this checks
      # out the site's own repo (private — ocubiqo/2sides, separate from
      # this public ocubiqo/2sides-data repo the cron lives in) and runs the
      # exact same build + deploy a human would run locally.
      #
      # Two secrets this needs that VOTE_API_BASE/VOTE_API_ADMIN_TOKEN don't
      # cover, both currently unset (no-ops until set — see the `if` guards):
      #   - REPO_2SIDES_READ_TOKEN: a GitHub PAT (fine-grained, read-only,
      #     scoped to ONLY ocubiqo/2sides "Contents") — needed because the
      #     default GITHUB_TOKEN this workflow gets only has access to the
      #     repo it runs in (2sides-data), not a separate private repo.
      #   - CLOUDFLARE_API_TOKEN: a Cloudflare API token scoped to
      #     "Cloudflare Pages:Edit" on this account only — wrangler reads it
      #     non-interactively via this env var, no `wrangler login` needed.
      - name: Checkout website repo
        id: checkout-site
        if: steps.commit.outputs.pushed == 'true'
        run: |
          if [ -z "${{ secrets.REPO_2SIDES_READ_TOKEN }}" ]; then
            echo "· REPO_2SIDES_READ_TOKEN unset — feed changed but the site won't rebuild yet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Full checkout, not sparse — web/ alone is NOT enough to build anyway
      # (web/tsconfig.json maps `@app/*` to `../WarSimMobile/src/*`, the
      # shared-contract rule: tokens/types/perspective imported directly,
      # never duplicated — see Phase D0), so sparse-checkout was only ever
      # saving partial clone time, not avoiding a real dependency. Kept
      # simple and robust over that modest saving: a first attempt at
      # sparse-checkout here reported success but did not actually produce
      # the expected directory (non-cone-mode pattern matching didn't behave
      # as expected, and this workflow can't be interactively debugged), so
      # a plain full checkout removes that whole failure class.
      - uses: actions/checkout@v4
        if: steps.checkout-site.outputs.ok == 'true'
        with:
          repository: ocubiqo/2sides
          token: ${{ secrets.REPO_2SIDES_READ_TOKEN }}
          ref: main
          path: site

      - name: Confirm expected layout before building
        if: steps.checkout-site.outputs.ok == 'true'
        run: |
          test -d site/web || { echo "✗ site/web missing after checkout — repo layout assumption is wrong"; ls -la site; exit 1; }
          test -d site/WarSimMobile/src || { echo "✗ site/WarSimMobile/src missing — @app/* imports will fail"; ls -la site; exit 1; }
          echo "✓ site/web and site/WarSimMobile/src both present"

      - name: Build + deploy website
        if: steps.checkout-site.outputs.ok == 'true'
        working-directory: site/web
        env:
          SITE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a78eb34288c255044ad926717937d038
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "· CLOUDFLARE_API_TOKEN unset — feed changed but the site won't rebuild yet"
            exit 0
          fi
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name=2sides-web --branch=main --commit-dirty=true
